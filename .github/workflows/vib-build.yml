
name: Vib Build

on:
  push:
    branches: [ "main", "test" ]
    tags:
      - '*'
  schedule:
    - cron: '21 */6 * * *'
  pull_request:
  workflow_dispatch:

env:
  CUSTOM_IMAGE_NAME: custom
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  check_update:
    runs-on: ubuntu-latest

    outputs:
      has_updates: ${{ steps.compare.outputs.has_updates }}
      base_image: ${{ steps.read_base_recipe.outputs.base_image }}

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo libfyaml-utils

      - name: Read base image name from recipe
        id: read_base_recipe
        run: |
          BASE_IMAGE="$(fy-filter -f recipe.yml /stages/0/base)"

          echo "Base image: $BASE_IMAGE"

          if [ -z "$BASE_IMAGE" ] || [ "$BASE_IMAGE" = "null" ]; then
            echo "Could not read base image from recipe.yml"
            exit 1
          fi

          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Get last successful run
        id: last_run
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_RUN_ID="$(gh run list \
            -b "$GITHUB_REF_NAME" \
            -w "$GITHUB_WORKFLOW" \
            -s success \
            -L 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          echo "Previous successful run: ${LAST_RUN_ID:-none}"
          echo "run_id=$LAST_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download previous digest
        if: ${{ steps.last_run.outputs.run_id != '' }}
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: digest
          path: previous-digest
          github-token: ${{ github.token }}
          run-id: ${{ steps.last_run.outputs.run_id }}

      - name: Compare base image digest
        id: compare
        run: |
          set -euo pipefail

          NEW_DIGEST="$(skopeo inspect --raw "docker://${BASE_IMAGE}" | sha256sum | awk '{print $1}')"

          OLD_DIGEST=""

          if [ -f previous-digest/digest.txt ]; then
            OLD_DIGEST="$(cat previous-digest/digest.txt)"
          fi

          echo "Previous digest: ${OLD_DIGEST:-none}"
          echo "Current digest: $NEW_DIGEST"

          echo "$NEW_DIGEST" > digest.txt

          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "This event requires a build."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          elif [ "$NEW_DIGEST" != "$OLD_DIGEST" ]; then
            echo "Base image has changed."
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to the base image."
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload current digest
        uses: actions/upload-artifact@v6
        with:
          name: digest
          path: digest.txt
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}
    needs: check_update
    if: ${{ needs.check_update.outputs.has_updates == 'true' }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: vanilla-os/vib-gh-action@v1.1.0
        with:
          recipe: 'recipe.yml'

      - uses: actions/upload-artifact@v7
        with:
          name: Containerfile
          path: Containerfile
          overwrite: true

      - name: Generate image name
        run: |
          REPO_OWNER_LOWERCASE="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
          echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/${{ env.CUSTOM_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Set image info
        run: |
          echo -n "${{ needs.check_update.outputs.base_image }}" > ./includes.container/image-info/base-image-name
          echo -n "${{ env.REPO_OWNER_LOWERCASE }}/${{ env.CUSTOM_IMAGE_NAME }}" > ./includes.container/image-info/image-name

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          tags: ${{ env.IMAGE_URL }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"

          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs: build

    permissions:
      actions: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Generate image name
        run: |
          REPO_OWNER_LOWERCASE="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"

          echo "REPO_OWNER_LOWERCASE=$REPO_OWNER_LOWERCASE" >> "$GITHUB_ENV"
          echo "IMAGE_URL=ghcr.io/$REPO_OWNER_LOWERCASE/${{ env.CUSTOM_IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_URL }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_URL }}@sha256:%s ' *)

      - name: Export digest
        id: export
        run: |
          echo "digest=$(docker buildx imagetools inspect \
            ${{ env.IMAGE_URL }}:${{ steps.meta.outputs.version }} \
            --format '{{json .Manifest}}' | jq -cr '.digest')" >> "$GITHUB_OUTPUT"

      - name: Attest pushed image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_URL }}
          subject-digest: ${{ steps.export.outputs.digest }}
          push-to-registry: false
